<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quote Generator App</title>
		<link rel="stylesheet" href="style.css" />
		<script defer src="script.js"></script>
	</head>
	<body>
		<main>
			<h1>Quote Generator</h1>
			<section>
				<article>
					<span class="quote-mark quote-mark-open">"</span>
					<p id="quote"></p>
					<p id="author"></p>
					<span class="quote-mark quote-mark-close">"</span>
				</article>
				<button type="button" id="new-quote">New quote</button>
			</section>
			<section>
				<form id="create-quote-form">
					<label for="quote-input">Quote</label>
					<textarea id="quote-input" name="quote" required></textarea>

					<label for="author-input">Author</label>
					<input
						id="author-input"
						name="author"
						type="text"
						required
					/>

					<button type="submit">Add quote</button>
				</form>

				<p id="form-feedback"></p>
			</section>
		</main>
	</body>
</html>
